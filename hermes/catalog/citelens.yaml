name: citelens
repo: https://github.com/Alexfeynman2023/citelens-mcp
sha: c3e466adadde6dbedab20b36fc852b4267728127
subdir: hermes
version: "0.1.0"
description: >-
  See how AI is citing your website. Access Bing Webmaster Tools data, submit URLs via
  IndexNow for instant indexing, and analyze AI citation reports from Bing. Perfect for
  SEO professionals tracking AI search visibility. Portable Agent Plugins v1 package
  (plugin.json + mcp.json), runs via npx -y citelens-mcp. Disclosure — Network calls:
  Bing Webmaster Tools API (ssl.bing.com), IndexNow API (api.indexnow.org). Local storage:
  SQLite database in ~/.citelens/ for historical snapshots. No telemetry or usage reporting.
maintainer: Alex Feynman
tier: community
category: tools
docs_url: https://github.com/Alexfeynman2023/citelens-mcp#readme
requires_hermes: ">=0.21.0"
platforms: []
capabilities:
  provides_tools:
    - bing_list_sites
    - bing_get_traffic
    - bing_get_query_stats
    - bing_get_page_stats
    - bing_get_crawl_stats
    - bing_get_crawl_issues
    - bing_get_url_info
    - bing_list_sitemaps
    - bing_submit_sitemap
    - bing_get_url_submission_quota
    - bing_submit_url
    - bing_submit_url_batch
    - indexnow_generate_key
    - indexnow_validate_key
    - indexnow_submit_url
    - indexnow_submit_batch
    - ai_import_citation_report
    - ai_get_top_cited_pages
    - ai_get_citation_trend
    - ai_get_top_queries
    - ai_get_top_intents
    - ai_get_top_topics
    - ai_compare_with_bing_stats
    - ai_get_import_history
    - snapshot_stats
    - list_snapshots
    - diff_stats
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - BING_WEBMASTER_API_KEY
