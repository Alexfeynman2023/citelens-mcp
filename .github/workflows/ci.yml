name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]
        exclude:
          # better-sqlite3 v12 has no Windows prebuilds for Node 20 (ABI v115)
          # and node-gyp build fails on GitHub Actions Windows runner
          - os: windows-latest
            node-version: 20.x
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify npm publish dry-run has no bin warnings
        run: |
          OUTPUT=$(npm publish --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "bin\["; then
            echo "ERROR: npm publish has bin field warnings"
            exit 1
          fi

      - name: Pack and verify tarball
        run: |
          npm pack
          tar tvf citelens-mcp-*.tgz | grep "dist/index.js"

      - name: Install packed tarball and verify bin works
        run: |
          mkdir -p /tmp/test-install
          cd /tmp/test-install
          npm init -y
          npm install $GITHUB_WORKSPACE/citelens-mcp-*.tgz
          
          # Verify bin symlink exists and is executable
          ls -la node_modules/.bin/citelens-mcp
          test -x node_modules/citelens-mcp/dist/index.js
          
          # Test MCP server responds to initialize + tools/list
          RESPONSE=$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1.0.0"}}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' | timeout 10 npx citelens-mcp 2>&1)
          echo "$RESPONSE"
          
          # Verify server info in initialize response
          echo "$RESPONSE" | grep -q '"serverInfo"'
          
          # Verify tools/list returns expected number of tools (27)
          TOOL_COUNT=$(echo "$RESPONSE" | tail -1 | jq '.result.tools | length')
          echo "Tool count: $TOOL_COUNT"
          if [ "$TOOL_COUNT" -ne 27 ]; then
            echo "ERROR: Expected 27 tools, got $TOOL_COUNT"
            exit 1
          fi
